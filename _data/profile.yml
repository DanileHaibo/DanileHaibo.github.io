short_bio: >-
  <p>
    I am a Ph.D. student in the <a href="https://www.cs.cityu.edu.hk/">Department of Computer Science</a> at the <a href="https://www.cityu.edu.hk/">City University of Hong Kong</a>, advised by <a href="https://www.cs.cityu.edu.hk/~jasonxue/">Prof. Chun Jason Xue</a> (IEEE Fellow) and <a href="https://www.cs.cityu.edu.hk/~jianwang/">Prof. Jianping Wang</a> (IEEE Fellow).
    My research focuses on <strong>Autonomous Driving</strong>, <strong>Vision-Language-Action (VLA)</strong>, and <strong>World Models</strong>, with a particular interest in making large multimodal models efficient and reliable for real-time on-vehicle deployment.
    Before my Ph.D., I received my Master's degree in Software Engineering from the <a href="https://en.uestc.edu.cn/">University of Electronic Science and Technology of China</a> (UESTC).
    I previously worked as a Senior Engineer at <a href="https://www.bytedance.com/">ByteDance</a> (TikTok Content Security) and as a Development Engineer at <a href="https://www.alibaba.com/">Alibaba</a> (Cainiao).
  </p>

